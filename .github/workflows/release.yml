# Builds the Ruby installer (Setup.exe) and publishes it in a GitHub release when a "vX.Y.Z" tag is pushed.
# Started by hand (Actions > Installer > Run workflow) it builds and verifies the installer without publishing anything.
name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # onnxruntime has no build for newer Python versions
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup 6.7.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-6_7_4 --repo jrsoftware/issrc --pattern "innosetup-6.7.4.exe" --dir "$env:RUNNER_TEMP"
          Start-Process "$env:RUNNER_TEMP\innosetup-6.7.4.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer (PyInstaller, selftest of the bundle, Inno Setup)
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ steps.version.outputs.version }}" -Python python

      - name: Verify the installer (install, selftest of the installed app, uninstall)
        shell: pwsh
        run: ./installer/verify.ps1 -Setup "installer/Output/Ruby-Setup-${{ steps.version.outputs.version }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: Ruby-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "installer/Output/Ruby-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content .github/release-notes.md -Raw).Replace("{{VERSION}}", $env:VERSION)
          $notes += @"

          ### Integrity

          SHA-256 of ``Ruby-Setup-$env:VERSION.exe``: ``$hash``
          "@
          Set-Content release-notes.md $notes -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" $setup --title "Ruby $env:VERSION" --notes-file release-notes.md --generate-notes
